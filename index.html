<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Password Generatorr</title>
  
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="container">
    <h1>Password Generator</h1>
    <div id="password" class="password-box">Click Generate</div>
    <div class="control">
      <label>
        Length: <span id="lengthValue">12</span>
      </label>
      <input type="range" id="length" min="4" max="32" value="12" />
    </div>

    <div class="checkbox-group">
      <label><input type="checkbox" id="uppercase" checked /> Uppercase</label>
      <label><input type="checkbox" id="lowercase" checked /> Lowercase</label>
      <label><input type="checkbox" id="numbers" checked /> Numbers</label>
      <label><input type="checkbox" id="symbols" /> Symbols</label>
    </div>

    <button onclick="generatePassword()">Generate Password</button>

    <div class="footer">Strong • Random • Secure</div>
  </div>

  
</body>
<script src="script.js" ></script>
</html>
